name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── JOB 1: Code & Build Validation ──
  validate-and-build:
    name: Code & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Node.js runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Validate Backend
      - name: Install & Validate Backend
        run: |
          cd server
          npm install --no-audit --prefer-offline
          node -e "console.log('Backend syntax validated successfully');"

      # 2. Validate & Build Frontend Production Bundle
      - name: Install & Build Frontend
        env:
          VITE_API_URL: https://project-mgmnt-eu2f.onrender.com/api
        run: |
          cd client
          npm install --no-audit --prefer-offline
          npm run build

  # ── JOB 2: Docker Container Image Validation ──
  docker-validation:
    name: Docker Container Image Validation
    needs: validate-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Test Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: trackit-backend:test

      - name: Test Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          build-args: |
            VITE_API_URL=https://project-mgmnt-eu2f.onrender.com/api
          push: false
          tags: trackit-frontend:test