name: ProjectMS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend
        run: docker build -t projectms-backend ./server

      - name: Build frontend
        run: docker build -t projectms-frontend ./client